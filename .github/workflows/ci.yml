name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        python -m pytest tests/ -v

    - name: Run linter
      run: |
        pip install flake8
        flake8 miniclaw/ --max-line-length=120 --exclude=__pycache__,.git,__init__.py

  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install -g pnpm
        pnpm install

    - name: Build frontend
      run: |
        cd frontend
        pnpm run build

  security-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install dependencies
      run: |
        uv pip install --system bandit safety

    - name: Run security checks
      run: |
        bandit -r miniclaw/ -c pyproject.toml
        safety check

  deploy-docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install dependencies
      run: |
        npm install -g marked
        uv pip install --system markdown

    - name: Prepare site structure
      run: |
        # Create output directory
        mkdir -p _site
        
        # Copy static site files if site folder exists
        if [ -d "site" ]; then
          cp -r site/. _site/
        else
          mkdir -p _site
        fi
        
        # Create docs directory in output
        mkdir -p _site/docs

    - name: Convert documentation to HTML
      run: |
        echo "Converting documentation files..."
        
        # Create a temporary Python script for conversion
        cat > convert_docs.py << 'EOF'
        import os
        import markdown
        import sys
        
        def convert_markdown_to_html(input_file, output_file):
            with open(input_file, 'r', encoding='utf-8') as f:
                md_content = f.read()
            
            # Convert markdown to HTML
            html_content = markdown.markdown(md_content, extensions=['fenced_code', 'tables'])
            
            # Wrap in basic HTML structure
            full_html = f"""<!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Documentation</title>
        </head>
        <body>
            <div class="doc-content">
                {html_content}
            </div>
        </body>
        </html>"""
            
            with open(output_file, 'w', encoding='utf-8') as f:
                f.write(full_html)
        
        if __name__ == "__main__":
            if len(sys.argv) != 3:
                print("Usage: python convert_docs.py <input.md> <output.html>")
                sys.exit(1)
                
            input_file = sys.argv[1]
            output_file = sys.argv[2]
            convert_markdown_to_html(input_file, output_file)
            print(f"Converted {input_file} to {output_file}")
        EOF
        
        # Process each documentation file
        if [ -d "docs" ]; then
          for file in docs/*.md; do
              if [ -f "$file" ]; then
                  filename=$(basename "$file" .md)
                  echo "Processing $filename.md -> $filename.html"
                  python convert_docs.py "$file" "_site/docs/${filename}.html"
              fi
          done
        fi
        
        echo "Documentation conversion completed"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-docs
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4