name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        python -m pytest tests/ -v

    - name: Run linter
      run: |
        pip install flake8
        flake8 miniclaw/ --max-line-length=120 --exclude=__pycache__,.git,__init__.py

  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install -g pnpm
        pnpm install

    - name: Build frontend
      run: |
        cd frontend
        pnpm run build

  security-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install dependencies
      run: |
        uv pip install --system bandit safety

    - name: Run security checks
      run: |
        # Run bandit but only fail on high severity issues
        bandit -r miniclaw/ -c pyproject.toml -lll || true
        safety check

  deploy-docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install dependencies
      run: |
        npm install -g marked
        uv pip install --system markdown

    - name: Prepare site structure
      run: |
        # Create output directory
        mkdir -p _site
        
        # Copy static site files if site folder exists
        if [ -d "site" ]; then
          cp -r site/. _site/
        else
          mkdir -p _site
        fi
        
        # Create docs directory in output
        mkdir -p _site/docs

    - name: Convert documentation to HTML (full /docs theme pages)
      run: |
        echo "Converting documentation files..."
        
        cat > convert_docs.py << 'PYEOF'
        import os
        import re
        import json
        import markdown

        def filename_to_title(filename):
            return re.sub(r'_', ' ', filename).title()

        def md_to_html(md_content):
            return markdown.markdown(md_content, extensions=['fenced_code', 'tables'])

        def docs_page_html(title, sidebar_html, content_html, active_id=None):
            active = active_id or ""
            return """<!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>""" + title + """ - MiniClaw Docs</title>
            <link rel="stylesheet" href="../css/docs.css">
            <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
        </head>
        <body class="docs-page">
            <header class="docs-header">
                <div class="logo">
                    <a href="../index.html"><span class="logo-emoji" aria-hidden="true">🦀</span> MiniClaw</a>
                </div>
                <nav class="docs-header-nav">
                    <a href="../index.html">Home</a>
                    <a href="index.html">Docs</a>
                    <button class="docs-theme-toggle" id="docs-theme-toggle" aria-label="Toggle theme">🌙</button>
                </nav>
            </header>
            <div class="docs-wrapper">
                <aside class="docs-sidebar">
                    <div class="docs-sidebar-title">Documentation</div>
                    <nav>""" + sidebar_html + """</nav>
                </aside>
                <main class="docs-main">
                    <div class="docs-content">""" + content_html + """</div>
                </main>
            </div>
            <script>
                (function(){
                    var t=document.getElementById('docs-theme-toggle');
                    var v=localStorage.getItem('docs-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
                    if(v==='dark'){ document.body.classList.add('dark-mode'); t.textContent='☀️'; }
                    t.onclick=function(){
                        document.body.classList.toggle('dark-mode');
                        var d=document.body.classList.contains('dark-mode');
                        localStorage.setItem('docs-theme',d?'dark':'light');
                        t.textContent=d?'☀️':'🌙';
                    };
                })();
            </script>
        </body>
        </html>"""

        def sidebar_links(doc_list, active_id):
            out = ["<ul>"]
            for d in doc_list:
                cls = ' class="active"' if d["id"] == active_id else ""
                out.append('<li><a href="%s.html"%s>%s</a></li>' % (d["id"], cls, d["title"]))
            out.append("</ul>")
            return "\n".join(out)

        if __name__ == "__main__":
            docs_dir = "docs"
            out_dir = "_site/docs"
            js_dir = "_site/js"
            os.makedirs(out_dir, exist_ok=True)
            os.makedirs(js_dir, exist_ok=True)
            doc_list = []
            for name in sorted(os.listdir(docs_dir)):
                if name.endswith(".md"):
                    base = name[:-3]
                    doc_list.append({"id": base, "title": filename_to_title(base)})

            for d in doc_list:
                input_path = os.path.join(docs_dir, d["id"] + ".md")
                with open(input_path, "r", encoding="utf-8") as f:
                    content_html = md_to_html(f.read())
                sidebar = sidebar_links(doc_list, d["id"])
                page = docs_page_html(d["title"], sidebar, content_html, d["id"])
                output_path = os.path.join(out_dir, d["id"] + ".html")
                with open(output_path, "w", encoding="utf-8") as f:
                    f.write(page)
                print("Generated docs/%s.html" % d["id"])

            index_sidebar = sidebar_links(doc_list, None)
            index_links = "\n".join(
                '<li><a href="%s.html">%s</a></li>' % (d["id"], d["title"]) for d in doc_list
            )
            index_content = "<h1>Documentation</h1><p>MiniClaw documentation, generated from the <code>docs/</code> folder.</p><ul class=\"docs-index-list\">%s</ul>" % index_links
            index_html = docs_page_html("Documentation", index_sidebar, index_content)
            with open(os.path.join(out_dir, "index.html"), "w", encoding="utf-8") as f:
                f.write(index_html)
            print("Generated docs/index.html")

            js_content = "window.DOCS_LIST = " + json.dumps(doc_list, indent=2) + ";\n"
            with open(os.path.join(js_dir, "docs-list.js"), "w", encoding="utf-8") as f:
                f.write(js_content)
            print("Wrote _site/js/docs-list.js")
        PYEOF

        python convert_docs.py
        echo "Documentation conversion completed"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-docs
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
