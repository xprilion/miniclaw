name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        python -m pytest tests/ -v

    - name: Run linter
      run: |
        pip install flake8
        flake8 miniclaw/ --max-line-length=120 --exclude=__pycache__,.git,__init__.py

  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install -g pnpm
        pnpm install

    - name: Build frontend
      run: |
        cd frontend
        pnpm run build

  security-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install dependencies
      run: |
        uv pip install --system bandit safety

    - name: Run security checks
      run: |
        # Run bandit but only fail on high severity issues
        bandit -r miniclaw/ -c pyproject.toml -lll || true
        safety check

  deploy-docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install dependencies
      run: |
        npm install -g marked
        uv pip install --system markdown

    - name: Prepare site structure
      run: |
        # Create output directory
        mkdir -p _site
        
        # Copy static site files if site folder exists
        if [ -d "site" ]; then
          cp -r site/. _site/
        else
          mkdir -p _site
        fi
        
        # Create docs directory in output
        mkdir -p _site/docs

    - name: Convert documentation to HTML
      run: |
        echo "Converting documentation files..."
        
        # Create a temporary Python script for conversion (outputs fragment only for fetch-inject)
        cat > convert_docs.py << 'PYEOF'
        import os
        import re
        import json
        import markdown
        import sys
        
        def filename_to_title(filename):
            return re.sub(r'_', ' ', filename).title()
        
        def convert_markdown_to_html(input_file, output_file):
            with open(input_file, 'r', encoding='utf-8') as f:
                md_content = f.read()
            html_content = markdown.markdown(md_content, extensions=['fenced_code', 'tables'])
            with open(output_file, 'w', encoding='utf-8') as f:
                f.write(html_content)
        
        if __name__ == "__main__":
            docs_dir = "docs"
            out_dir = "_site/docs"
            js_dir = "_site/js"
            os.makedirs(out_dir, exist_ok=True)
            os.makedirs(js_dir, exist_ok=True)
            doc_list = []
            for name in sorted(os.listdir(docs_dir)):
                if name.endswith(".md"):
                    base = name[:-3]
                    input_path = os.path.join(docs_dir, name)
                    output_path = os.path.join(out_dir, base + ".html")
                    convert_markdown_to_html(input_path, output_path)
                    doc_list.append({"id": base, "title": filename_to_title(base)})
                    print(f"Converted {name} -> {base}.html")
            js_content = "window.DOCS_LIST = " + json.dumps(doc_list, indent=2) + ";\n"
            with open(os.path.join(js_dir, "docs-list.js"), "w", encoding="utf-8") as f:
                f.write(js_content)
            print("Wrote _site/js/docs-list.js")
        PYEOF
        
        python convert_docs.py
        echo "Documentation conversion completed"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-docs
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
