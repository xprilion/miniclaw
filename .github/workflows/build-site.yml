name: Build and Deploy Site

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          npm install -g marked
          pip install markdown

      - name: Prepare site structure
        run: |
          # Create output directory
          mkdir -p _site
          
          # Copy static site files
          cp -r site/. _site/
          
          # Create docs directory in output
          mkdir -p _site/docs

      - name: Convert documentation to HTML
        run: |
          echo "Converting documentation files..."
          
          # Create a temporary Python script for conversion
          cat > convert_docs.py << 'EOF'
          import os
          import markdown
          import sys
          
          def convert_markdown_to_html(input_file, output_file):
              with open(input_file, 'r', encoding='utf-8') as f:
                  md_content = f.read()
              
              # Convert markdown to HTML
              html_content = markdown.markdown(md_content, extensions=['fenced_code', 'tables'])
              
              # Wrap in basic HTML structure
              full_html = f"""<!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Documentation</title>
              <link rel="stylesheet" href="../css/style.css">
          </head>
          <body>
              <div class="doc-content">
                  {html_content}
              </div>
          </body>
          </html>"""
              
              with open(output_file, 'w', encoding='utf-8') as f:
                  f.write(full_html)
          
          if __name__ == "__main__":
              if len(sys.argv) != 3:
                  print("Usage: python convert_docs.py <input.md> <output.html>")
                  sys.exit(1)
                  
              input_file = sys.argv[1]
              output_file = sys.argv[2]
              convert_markdown_to_html(input_file, output_file)
              print(f"Converted {input_file} to {output_file}")
          EOF
          
          # Process each documentation file
          DOC_NAV=""
          DOCS_JSON="["
          
          for file in docs/*.md; do
              if [ -f "$file" ]; then
                  filename=$(basename "$file" .md)
                  title=$(echo "$filename" | sed 's/_/ /g' | sed 's/\b\w/\U&/g')
                  
                  echo "Processing $filename.md -> $filename.html"
                  
                  # Convert markdown to HTML
                  python convert_docs.py "$file" "_site/docs/${filename}.html"
                  
                  # Add to navigation
                  DOC_NAV="$DOC_NAV<li><a href=\"#\" data-doc=\"$filename\">$title</a></li>"
                  
                  # Add to JSON array
                  if [ "$DOCS_JSON" != "[" ]; then
                      DOCS_JSON="$DOCS_JSON,"
                  fi
                  DOCS_JSON="$DOCS_JSON{\"id\":\"$filename\",\"title\":\"$title\",\"file\":\"$filename.html\"}"
              fi
          done
          
          DOCS_JSON="$DOCS_JSON]"
          
          # Save navigation and JSON data
          echo "$DOC_NAV" > /tmp/doc_nav.html
          echo "$DOCS_JSON" > /tmp/docs_data.json
          
          echo "Documentation conversion completed"

      - name: Inject documentation navigation
        run: |
          # Read the generated navigation
          if [ -f /tmp/doc_nav.html ]; then
              DOC_NAV=$(cat /tmp/doc_nav.html)
          else
              DOC_NAV="<li>No documentation available</li>"
          fi
          
          # Read the docs data
          if [ -f /tmp/docs_data.json ]; then
              DOCS_DATA=$(cat /tmp/docs_data.json)
          else
              DOCS_DATA="[]"
          fi
          
          # Inject navigation into index.html
          sed -i "s|<!-- Documentation navigation will be generated here -->|<ul>$DOC_NAV</ul>|" _site/index.html
          
          # Inject docs data into JavaScript
          ESCAPED_DOCS_DATA=$(echo "$DOCS_DATA" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          sed -i "s|// DOCS_DATA_PLACEHOLDER|const docFiles = $DOCS_DATA;|" _site/js/main.js
          
          echo "Documentation navigation injected"

      - name: Verify site structure
        run: |
          echo "Site structure:"
          find _site -type f | sort
          echo ""
          echo "Documentation files:"
          ls -la _site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4