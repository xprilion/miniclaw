<!doctype html>
<html lang="en" class="h-full bg-gray-50 dark:bg-gray-900 antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>MiniClaw</title>
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('miniclaw_theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="h-full bg-gray-50 dark:bg-gray-900">
    <div id="miniclaw-loading-bar" class="fixed left-0 top-0 z-50 h-0.5 w-0 bg-primary-500 transition-all duration-300 ease-out" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
