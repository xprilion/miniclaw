[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniclaw"
version = "0.1.0"
description = "Ultra-lightweight personal AI assistant with Ollama, tools, Telegram, and web UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MiniClaw" }]
keywords = ["ai", "assistant", "ollama", "telegram", "agent", "cli"]
dependencies = [
  "litellm>=1.0.0",
  "celery>=5.0.0",
  "pytz>=2024.1",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.23.0",
  "jinja2>=3.0.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
miniclaw = "miniclaw.cli.cli:run_cli"
miniclaw-service-install = "miniclaw.service_installer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["miniclaw*"]

[tool.setuptools.package-data]
"*" = []

[tool.setuptools]
py-modules = ["miniclaw.cli.cli"]

[tool.bandit]
# Exclude high severity issues that are intentional for the functionality of the application
exclude_dirs = ["/test/", "/tests/"]
# Skip B602 (subprocess_popen_with_shell_equals_true) as it's needed for tool execution
skips = ["B602"]
# Only fail on HIGH severity issues that we haven't explicitly excluded
severity = "high"
confidence = "high"
